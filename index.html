<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omar Rakha | أداة تحميل الفيديوهات</title>
    <!-- خط تجوال -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!-- مكتبة الأيقونات Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(17, 24, 39, 0.7);
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(37, 99, 235, 0.1) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 2rem 1rem;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 900;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
        }

        .input-group {
            display: flex;
            gap: 0.75rem;
            flex-direction: column;
        }

        @media(min-width: 480px) {
            .input-group {
                flex-direction: row;
            }
        }

        input[type="url"] {
            flex: 1;
            background: rgba(3, 7, 18, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 0.85rem 1rem;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="url"]:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        button {
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 0.85rem 1.75rem;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        button:hover {
            background: var(--primary-hover);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #resultArea {
            margin-top: 1.5rem;
            display: none;
            text-align: center;
        }

        .download-btn-ready {
            background: #10b981;
            width: 100%;
            text-decoration: none;
            color: white;
            padding: 0.9rem;
            border-radius: 10px;
            display: inline-block;
            font-weight: 700;
            transition: 0.3s ease;
        }

        .download-btn-ready:hover {
            background: #059669;
        }

        .error-msg {
            color: #ef4444;
            font-size: 0.9rem;
            margin-top: 1rem;
            display: none;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 2rem;
        }

        .feature-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            padding: 1rem;
            border-radius: 10px;
            text-align: center;
        }

        .feature-item i {
            font-size: 1.5rem;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }

        .feature-item h3 {
            font-size: 0.95rem;
            margin-bottom: 0.25rem;
        }

        .feature-item p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid var(--border-color);
            background: rgba(3, 7, 18, 0.3);
        }

        footer span {
            color: var(--primary-color);
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Omar Rakha Downloader</h1>
            <p>أداة احترافية وسريعة لتحميل الفيديوهات من منصات التواصل الاجتماعي</p>
        </header>

        <div class="card">
            <div class="input-group">
                <input type="url" id="videoUrl" placeholder="ألصق رابط الفيديو هنا (تيك توك، يوتيوب، إنستغرام...)" required>
                <button id="btnSubmit" onclick="handleDownload()">
                    <i class="fa-solid fa-download"></i> جلب الرابط
                </button>
            </div>

            <div id="errorArea" class="error-msg"></div>

            <div id="resultArea">
                <a id="downloadLink" href="#" target="_blank" class="download-btn-ready">
                    <i class="fa-solid fa-file-arrow-down"></i> اضغط هنا لتحميل الفيديو مباشرة
                </a>
            </div>

            <div class="features">
                <div class="feature-item">
                    <i class="fa-solid fa-bolt"></i>
                    <h3>سرعة عالية</h3>
                    <p>تحميل مباشر بأعلى جودة متاحة</p>
                </div>
                <div class="feature-item">
                    <i class="fa-solid fa-shield-halved"></i>
                    <h3>آمن تماماً</h3>
                    <p>بدون برامج ضارة أو نوافذ مزعجة</p>
                </div>
                <div class="feature-item">
                    <i class="fa-solid fa-mobile-screen"></i>
                    <h3>متوافق كلياً</h3>
                    <p>يعمل بكفاءة على الهاتف والكمبيوتر</p>
                </div>
            </div>
        </div>
    </div>

    <footer>
        تم التطوير بواسطة <span>عمر رخا</span> &copy; 2026
    </footer>

    <script>
        async function handleDownload() {
            const urlInput = document.getElementById('videoUrl').value.trim();
            const btn = document.getElementById('btnSubmit');
            const resultArea = document.getElementById('resultArea');
            const downloadLink = document.getElementById('downloadLink');
            const errorArea = document.getElementById('errorArea');

            errorArea.style.display = 'none';
            resultArea.style.display = 'none';

            if (!urlInput) {
                showError('الرجاء إدخال رابط صحيح أولاً!');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري المعالجة...';

            try {
                const response = await fetch('https://api.cobalt.tools/api/json', {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        url: urlInput,
                        vQuality: 'max'
                    })
                });

                const data = await response.json();

                if (data.status === 'stream' || data.status === 'redirect') {
                    downloadLink.href = data.url;
                    resultArea.style.display = 'block';
                } else if (data.status === 'picker') {
                    downloadLink.href = data.picker[0].url;
                    resultArea.style.display = 'block';
                } else {
                    showError('تعذر جلب رابط التحميل، تأكد من صحة الرابط أو حاول لاحقاً.');
                }
            } catch (err) {
                showError('حدث خطأ أثناء الاتصال بالسيرفر. حاول مرة أخرى.');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-download"></i> جلب الرابط';
            }
        }

        function showError(msg) {
            const errorArea = document.getElementById('errorArea');
            errorArea.innerText = msg;
            errorArea.style.display = 'block';
        }
    </script>
</body>
</html>
